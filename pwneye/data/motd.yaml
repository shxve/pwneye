messages:
  - "Noooooooooooooh... telecamera?"
  - "The real question is: who is watching whom?"
  - "The city watches through cheap glass and default passwords"
  - "Some cameras protect a building. Others betray it."
  - "This is what a panopticon looks like from the inside"
  - "The panopticon survives on asymmetry"
  - "Every bush is warded"
  - "Surveillance works both ways"
  - "Watching the watchers"
  - "Enumerate. Authenticate. Observe."
  - "Accidentally terrifying..."
  - "Observability and controllability of a linear system are mathematical duals"
